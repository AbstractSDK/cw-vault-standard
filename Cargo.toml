[workspace]
members = [
    "cw-vault-standard",
    "test-helpers",
]
resolver = "2"

[workspace.package]
edition           = "2021"
authors           = ["Sturdy <sturdy@apollo.farm>", "Pacman <pacman@apollo.farm>"]
license           = "Apache-2.0"
homepage          = "https://github.com/apollodao/cw-vault-standard/"
repository        = "https://github.com/apollodao/cw-vault-standard/"
keywords          = ["cosmos", "cosmwasm"]

[workspace.dependencies]
cosmwasm-std                    = "2.0.0"
schemars                        = "0.8.11"
serde                           = { version = "1.0.152", default-features = false, features = ["derive"] }
cosmwasm-schema                 = "2.0.0"
cw-utils                        = { version = "2.0.0" }
cw20                            = { version = "2.0.0" }
cw-storage-plus                 = "2.0.0"
cw2                             = "2.0.0"
osmosis-std                     = "0.27.0"
cw-vault-standard               = { version = "0.5.0", path = "./cw-vault-standard" }
cw-vault-standard-test-helpers  = { version = "0.6.0", path = "./test-helpers" }
cw-orch                         = { version = "0.25.1"}

# dev dependencies
proptest          = "1.2.0"


[profile.release]
codegen-units     = 1
debug             = false
debug-assertions  = false
incremental       = false
lto               = true
overflow-checks   = true
opt-level         = 3
panic             = "abort"
rpath             = false
